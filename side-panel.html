<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>About panel</title>
<style>
  :root {
    --aop-text: #202124;
    --aop-text-muted: #5f6368;
    --aop-bg: #ffffff;
    --aop-border: #e8eaed;
    --aop-accent: #1a73e8;
    --aop-accent-text: #ffffff;
    --aop-card-bg: #f1f3f4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --aop-text: #e8eaed;
      --aop-text-muted: #9aa0a6;
      --aop-bg: #202124;
      --aop-border: #3c4043;
      --aop-accent: #8ab4f8;
      --aop-accent-text: #202124;
      --aop-card-bg: #303134;
    }
  }

  body {
    font-family: -apple-system, system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    color: var(--aop-text);
    background: var(--aop-bg);
  }

  .aop-empty {
    color: var(--aop-text-muted);
    font-size: 14px;
  }

  .aop-heading {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .aop-image {
    display: none;
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    background: var(--aop-card-bg);
    border-radius: 8px;
    margin-bottom: 12px;
  }

  .aop-abstract {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 12px;
  }

  .aop-map {
    width: 100%;
    height: 220px;
    border: 0;
    border-radius: 8px;
    display: none;
    margin-bottom: 12px;
  }

  .aop-link-row {
    margin-top: 8px;
  }

  .aop-btn-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--aop-accent);
    color: var(--aop-accent-text);
    border-radius: 999px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: opacity 0.15s ease;
  }

  .aop-btn-link:hover {
    opacity: 0.85;
  }

  .aop-source {
    font-size: 11px;
    color: var(--aop-text-muted);
    margin-top: 16px;
  }

  .aop-movie-panel {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--aop-border);
  }

  .aop-movie-heading {
    font-size: 16px;
    margin: 0 0 10px;
  }

  .aop-cast-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .aop-person-card {
    text-align: center;
    font-size: 12px;
    display: block;
    color: inherit;
    text-decoration: none;
    border-radius: 8px;
    padding: 4px;
    transition: background 0.15s ease;
  }

  a.aop-person-card:hover {
    background: var(--aop-card-bg);
    cursor: pointer;
  }

  .aop-more-btn {
    grid-column: 1 / -1;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--aop-border);
    border-radius: 8px;
    color: var(--aop-text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .aop-more-btn:hover {
    background: var(--aop-card-bg);
  }

  .aop-person-img {
    display: block;
    width: 100%;
    aspect-ratio: 13 / 16;
    border-radius: 6px;
    object-fit: cover;
    background: var(--aop-card-bg);
    margin: 0 auto 6px;
  }

  .aop-person-img-placeholder {
    background-image: linear-gradient(
      135deg,
      var(--aop-card-bg) 0%,
      var(--aop-border) 50%,
      var(--aop-card-bg) 100%
    );
    background-position: center;
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }

  .aop-person-name {
    font-weight: 600;
  }

  .aop-person-subtitle {
    color: var(--aop-text);
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div class="aop-empty" id="aopEmpty">Aucune information à afficher pour l'instant.</div>

  <div id="aopPanel" style="display:none">
    <h1 class="aop-heading" id="aopHeading"></h1>
    <img class="aop-image" id="aopImage" alt="" />
    <div class="aop-abstract" id="aopAbstract"></div>
    <iframe class="aop-map" id="aopMap" loading="lazy"></iframe>
    <div class="aop-link-row" id="aopOfficialSiteRow" style="display:none">
      <a class="aop-btn-link" id="aopOfficialSiteLink" target="_blank" rel="noopener">🔗 Site officiel</a>
    </div>
    <div class="aop-link-row" id="aopAbstractUrlRow" style="display:none">
      <a class="aop-btn-link" id="aopAbstractUrlLink" target="_blank" rel="noopener">📖 Voir sur Wikipedia</a>
    </div>
    <div class="aop-source" id="aopSourceLine"></div>
  </div>

  <div class="aop-movie-panel" id="aopMoviePanel" style="display:none">
    <h2 class="aop-movie-heading" id="aopMovieHeading"></h2>
    <div class="aop-cast-grid" id="aopMovieCastGrid"></div>
    <div class="aop-source" id="aopMovieSourceLine">Source : TMDB</div>
  </div>

  <script src="side-panel.js"></script>
</body>
</html>
